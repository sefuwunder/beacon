<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<title>Beacon — business entity search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%232b3fd6' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%232b3fd6' stroke-width='2' opacity='.55'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%232b3fd6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="brand" href="#/">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2" opacity=".55"/><circle cx="16" cy="16" r="3" fill="currentColor"/></svg>
      <span>Beacon</span>
    </a>
    <button id="keysBtn" class="iconbtn" aria-label="API keys">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9m-4 4l3 3m-6 0l2 2"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <div id="sheetWrap" class="sheet-wrap" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true"><div id="sheetBody"></div></div>
  </div>

  <div id="toast" class="toast" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
